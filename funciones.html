<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CinePlus | Funciones</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <header id="nav"></header>
  <main class="container py-4">
    <h1 class="marquee h2">Funciones y asientos</h1>
    <p class="text-secondary" id="peli"></p>
    <div id="aviso"></div>
    <div id="panel">
      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-md-4"><label for="fecha" class="form-label">Fecha</label><input type="date" id="fecha" class="form-control"></div>
        <div class="col-sm-6 col-md-4"><label for="hora" class="form-label">Hora</label>
          <select id="hora" class="form-select"><option>14:00</option><option>16:30</option><option selected>19:00</option><option>21:30</option></select></div>
      </div>
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="pantalla">PANTALLA</div>
          <div id="mapa" class="sala"></div>
          <div class="leyenda d-flex flex-wrap gap-3 justify-content-center mt-3">
            <span><i class="seat libre"></i> Libre</span><span><i class="seat seleccionado"></i> Seleccionado</span><span><i class="seat ocupado"></i> Ocupado</span>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="resumen">
            <h2 class="h5">Tu selección</h2>
            <p class="mb-1">Asientos: <strong id="resumen">—</strong></p>
            <p>Total: <strong id="total">$0</strong></p>
            <a id="btnCarrito" href="carrito.html" class="btn btn-warning w-100 disabled"><i class="bi bi-cart3"></i> Ir al carrito</a>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="text-center py-4 text-secondary">CinePlus · Compra simulada, no se realiza ningún cobro.</footer>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/asientos.js"></script>
</body>
</html>
