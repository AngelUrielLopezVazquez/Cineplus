<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CinePlus | Cartelera</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <header id="nav"></header>
  <main class="container py-4">
    <section class="text-center py-3">
      <h1 class="marquee display-5">Cartelera</h1>
      <p class="lead text-secondary">Elige tu película y reserva tus asientos.</p>
    </section>
    <div class="d-flex flex-wrap gap-3 align-items-center mb-4">
      <div id="filtros" class="d-flex flex-wrap gap-2"></div>
      <input id="buscar" type="search" class="form-control ms-md-auto" style="max-width:260px" placeholder="Buscar título" aria-label="Buscar película">
    </div>
    <div id="peliculas" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"></div>
  </main>
  <footer class="text-center py-4 text-secondary">CinePlus · Compra simulada, no se realiza ningún cobro.</footer>
  <div class="modal fade" id="modalPelicula" tabindex="-1" aria-labelledby="mTitulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content boleto">
        <div class="modal-header border-0">
          <h2 class="modal-title h4 marquee" id="mTitulo"></h2>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p id="mSinopsis"></p>
          <div class="ratio ratio-16x9"><iframe id="mTrailer" title="Tráiler" allowfullscreen></iframe></div>
        </div>
        <div class="modal-footer border-0">
          <button id="mElegir" class="btn btn-warning"><i class="bi bi-ticket-perforated"></i> Elegir función</button>
        </div>
      </div>
    </div>
  </div>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/cartelera.js"></script>
</body>
</html>
